name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Check patch whitespace
        run: git diff --check
      - name: Run tests
        run: bundle exec rake test
      - name: Check docs version consistency
        run: bundle exec ruby script/check_docs_version.rb
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run compatibility vectors
        run: bundle exec rake vectors
      - name: Build gem
        run: bundle exec rake build
      - name: Smoke-test installed gem
        run: bundle exec ./script/verify_gem_install.sh pkg/fhirpath-*.gem

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run tests with coverage
        env:
          COVERAGE: "1"
        run: bundle exec rake test
      - name: Validate coverage summary
        run: bundle exec ruby script/check_coverage.rb coverage/summary.json
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage
          path: coverage/summary.json
          if-no-files-found: error

  conformance:
    name: Conformance gates (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Validate official suite corpus contract
        run: bundle exec rake conformance:validate
      - name: Generate official suite report
        run: bundle exec rake conformance:official
      - name: Generate fhirpath.js compatibility report
        run: bundle exec rake conformance:fhirpath_js
      - name: Check baseline regression
        run: bundle exec rake conformance:baseline
      - name: Upload official suite report
        uses: actions/upload-artifact@v7
        with:
          name: official-suite-report-${{ matrix.ruby }}
          path: conformance/reports/official-r4-report.json
          if-no-files-found: warn
      - name: Upload fhirpath.js report
        uses: actions/upload-artifact@v7
        with:
          name: fhirpath-js-report-${{ matrix.ruby }}
          path: conformance/reports/fhirpath-js-report.json
          if-no-files-found: warn
